<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${campaign.name}">Campaign</title>
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <link rel="stylesheet" th:href="@{/css/campaign-details.css}">

    <script src="/js/api-fetch.js" defer></script>
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<main class="page-content">
    <div class="detail-header">
        <div>
            <h1 th:text="${campaign.name}"></h1>
            <span class="status-tag" th:classappend="${campaign.complete} ? 'inactive' : ''"
                  th:text="${campaign.complete} ? 'Completed' : 'Active'"></span>
        </div>
    </div>

    <div class="detail-actions">
        <form th:action="@{/campaigns/{id}/toggle-complete(id=${campaign.id})}" method="post">
            <button type="submit" class="btn btn-secondary btn-small"
                    th:text="${campaign.complete} ? 'Mark as Active' : 'Mark as Complete'"></button>
        </form>
        <button type="button" class="btn btn-danger btn-small" id="delete-campaign-btn">Delete Campaign</button>
    </div>

    <!-- ===== Party Members ===== -->
    <section class="detail-section stat-card">
        <h2>Party Members</h2>
        <ul id="party-member-list" class="item-list">
            <li th:each="member : ${partyMembers}" th:data-member-id="${member.id}">
                <div class="item-info">
                    <span class="member-name" th:text="${member.name}"></span>
                    <span class="item-meta" th:if="${!member.active}">(inactive)</span>
                </div>
                <div class="item-actions">
                    <form th:action="@{/party-members/{id}/toggle-active(id=${member.id})}" method="post">
                        <button type="submit" class="btn btn-secondary btn-small"
                                th:text="${member.active} ? 'Set Inactive' : 'Set Active'"></button>
                    </form>
                    <button type="button" class="btn btn-danger btn-small delete-member-btn">Delete</button>
                </div>
            </li>
        </ul>
        <button type="button" class="add-row-btn" id="add-member-btn">+ Add Party Member</button>
    </section>

    <!-- ===== Monster Templates ===== -->
    <section class="detail-section stat-card">
        <h2>Monster Templates</h2>
        <ul id="template-list" class="item-list">
            <li th:each="t : ${monsterTemplates}" th:data-template-id="${t.id}">
                <div class="item-info">
                    <span th:text="${t.name}"></span>
                    <span class="item-meta"
                          th:text="'HP: ' + (${t.hp} ?: '-') + '/' + (${t.maxHp} ?: '-') + ', AC: ' + (${t.ac} ?: '-')"></span>
                </div>
                <div class="item-actions">
                    <button type="button" class="btn btn-danger btn-small delete-template-btn">Delete</button>
                </div>
            </li>
        </ul>
        <button type="button" class="add-row-btn" id="add-template-btn">+ Add Monster Template</button>
    </section>

    <!-- ===== Encounters ===== -->
    <section class="detail-section stat-card">
        <h2>Encounters</h2>
        <ul id="encounter-list" class="item-list">
            <li th:each="encounter : ${encounters}" th:data-encounter-id="${encounter.id}" class="clickable-row">
                <div class="item-info">
                    <a th:href="@{/encounters/{id}(id=${encounter.id})}" th:text="${encounter.name}"></a>
                    <span class="item-meta" th:if="${encounter.complete}">(completed)</span>
                </div>
                <div class="item-actions">
                    <button type="button" class="btn btn-danger btn-small delete-encounter-btn">Delete</button>
                </div>
            </li>
        </ul>
        <button type="button" class="add-row-btn" id="add-encounter-btn">+ Add Encounter</button>
    </section>
</main>

<!-- Add Party Member Modal -->
<div id="member-modal" class="modal-overlay" style="display: none;">
    <div class="modal-box">
        <h3>Add Party Member</h3>
        <label>
            Character Name
            <input type="text" id="member-modal-name" maxlength="30">
        </label>
        <div class="modal-actions">
            <button type="button" id="member-modal-cancel" class="btn btn-secondary btn-small">Cancel</button>
            <button type="button" id="member-modal-save" class="btn btn-primary btn-small">Add</button>
        </div>
    </div>
</div>

<!-- Add Encounter Modal -->
<div id="encounter-modal" class="modal-overlay" style="display: none;">
    <div class="modal-box">
        <h3>Add Encounter</h3>
        <label>
            Encounter Name
            <input type="text" id="encounter-modal-name" maxlength="50">
        </label>
        <div class="modal-actions">
            <button type="button" id="encounter-modal-cancel" class="btn btn-secondary btn-small">Cancel</button>
            <button type="button" id="encounter-modal-save" class="btn btn-primary btn-small">Create</button>
        </div>
    </div>
</div>

<!-- Add Monster Template Modal -->
<div id="template-modal" class="modal-overlay" style="display: none;">
    <div class="modal-box">
        <h3>Add Monster Template</h3>
        <label>Name
            <input type="text" id="template-modal-name" maxlength="30">
        </label>
        <label class="hp-label">HP
            <span class="hp-slash-group">
                <input type="number" id="template-modal-hp">
                <span>/</span>
                <input type="number" id="template-modal-maxhp">
            </span>
        </label>
        <label>AC
            <input type="number" id="template-modal-ac">
        </label>
        <div class="modal-actions">
            <button type="button" id="template-modal-cancel" class="btn btn-secondary btn-small">Cancel</button>
            <button type="button" id="template-modal-save" class="btn btn-primary btn-small">Add</button>
        </div>
    </div>
</div>

<!-- Delete Campaign Modal -->
<div id="delete-campaign-modal" class="modal-overlay" style="display: none;">
    <div class="modal-box">
        <h3>Delete Campaign</h3>
        <p>This will permanently delete <strong th:text="${campaign.name}"></strong>,
            along with every encounter, party member, and combatant in it.</p>
        <p>Type the campaign name to confirm:</p>
        <input type="text" id="delete-campaign-input" autocomplete="off">
        <div class="modal-actions">
            <button type="button" id="delete-campaign-cancel" class="btn btn-secondary btn-small">Cancel</button>
            <button type="button" id="delete-campaign-confirm" class="btn btn-danger btn-small" disabled>Delete Forever</button>
        </div>
    </div>
</div>

<script th:inline="javascript">
    const campaignId = /*[[${campaign.id}]]*/ 0;
    const campaignName = /*[[${campaign.name}]]*/ '';
</script>
<script src="/js/campaign-details.js" defer></script>
</body>
</html>
