<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register - DND Encounter Tool</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
</head>
<body>
<main class="auth-page">
    <h1>Dungeons & Dragons Encounter Tool</h1>

    <section class="stat-card auth-card">
        <h2>Register an Account</h2>

        <p th:if="${error}" class="auth-message error" th:text="${error}"></p>

        <form th:action="@{/register}" th:object="${user}" method="post">
            <div class="field-group">
                <label for="username">Username</label>
                <input type="text" id="username" th:field="*{username}" required>
            </div>
            <div class="field-group">
                <label for="password">Password</label>
                <input type="password" id="password" th:field="*{password}" required>
            </div>
            <button type="submit" class="btn btn-primary">Register</button>
        </form>

        <p class="auth-footer">Already have an account? <a th:href="@{/login}">Log in</a></p>
    </section>
</main>
</body>
</html>
