<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title th:text="${encounter.name}">Encounter</title>
  <meta name="_csrf" th:content="${_csrf.token}">
  <meta name="_csrf_header" th:content="${_csrf.headerName}">
  <style>
    .combatant-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
    }
    .combatant-tile {
        width: 200px;
        border: 1px solid #ccc;
        border-radius: 8px;
        padding: 12px;
    }
    .current-turn {
        width: 200px;
        border: 5px solid #ccc;
        border-radius: 8px;
        padding: 12px;
    }
    .combatant-tile.incapacitated {
        opacity: 0.5;
        background-color: #fdd;
    }
    .combatant-tile label {
        display: block;
        font-size: 0.8em;
        margin-top: 6px;
    }
    .combatant-tile input[type="number"] {
        width: 60px;
    }
  </style>
  <script>
    const csrfToken = document.querySelector('meta[name="_csrf"]').content;
    const csrfHeader = document.querySelector('meta[name="_csrf_header"]').content;

    async function apiFetch(url, options = {}) {
        try {
            const headers = {
                'Content-Type': 'application/json',
                [csrfHeader]: csrfToken,
                ...(options.headers || {})
            };

            const response = await fetch(url, { ...options, headers });

            if (!response.ok) {
                const text = await response.text();
                throw new Error(`Request failed (${response.status}): ${text}`);
            }

            if (response.status === 204) return null;
            return await response.json();
        } catch (err) {
            console.error('apiFetch error:', err);
            alert('Something went wrong: ' + err.message);
            throw err;
        }
    }
  </script>
</head>
<body>
<p><a th:href="@{/campaigns/{id}(id=${encounter.campaign.id})}">&larr; Back to Campaign</a></p>

<h1 th:text="${encounter.name}"></h1>
<form th:action="@{/encounters/{id}/toggle-complete(id=${encounter.id})}" method="post">
  <button type="submit" th:text="${encounter.complete} ? 'Mark as Active' : 'Mark as Complete'"></button>
</form>

<h2>Combatants</h2>
<button type="button" onclick="previousTurn()">Previous Turn</button>
<button type="button" onclick="nextTurn()">Next Turn</button>
<div class="combatant-grid">
  <div th:each="c : ${combatants}"
       class="combatant-tile"
       th:classappend="${c.incapacitated} ? 'incapacitated' : ''"
       th:data-combatant-id="${c.id}"
       th:data-incapacitated="${c.incapacitated}"
       th:data-initiative="${c.initiative}">

    <strong th:text="${c.name}"></strong>
    <span th:text="${c.player} ? ' (Player)' : ' (NPC)'"></span>

    <label>
      Initiative
      <input type="number" class="initiative-input" th:value="${c.initiative}">
    </label>

    <div th:unless="${c.player}">
      <label>
        HP
        <input type="number" class="hp-input" th:value="${c.hp}">
      </label>
      <label>
        Max HP
        <input type="number" class="maxhp-input" th:value="${c.maxHp}">
      </label>
    </div>

    <label>
      <input type="checkbox" class="incapacitated-input" th:checked="${c.incapacitated}">
      Incapacitated
    </label>

    <button type="button" class="update-btn">Update</button>

    <div class="statuses">
      <strong>Statuses:</strong>
      <ul>
        <li th:each="s : ${c.statuses}">
          <span th:text="${s.status}"></span>
          <form th:action="@{/statuses/{sid}/delete(sid=${s.id})}" method="post" style="display:inline;">
            <button type="submit">x</button>
          </form>
        </li>
        <li th:if="${c.statuses.isEmpty()}">None</li>
      </ul>

      <form th:action="@{/combatants/{cid}/statuses(cid=${c.id})}" method="post">
        <input type="text" name="status" placeholder="Add status" maxlength="25" required>
        <button type="submit">Add</button>
      </form>
    </div>
  </div>

  <p th:if="${combatants.isEmpty()}">No combatants yet.</p>
</div>

<a th:href="@{/encounters/{id}/combatants/new(id=${encounter.id})}">+ Add NPC/Enemy</a>
<script th:inline="javascript">
  const encounterId = /*[[${encounter.id}]]*/ 0;
  const initialTurnId = /*[[${encounter.currentTurn != null ? encounter.currentTurn.id : null}]]*/ null;

  let currentTurnId = initialTurnId;

  function getTiles() {
      return Array.from(document.querySelectorAll('.combatant-tile'));
  }

  async function saveCurrentTurn(combatantId) {
      return apiFetch(`/api/encounters/${encounterId}/current-turn`, {
          method: 'PUT',
          body: JSON.stringify({ combatantId })
      });
  }

  function highlightCurrentTurn() {
      getTiles().forEach(tile => {
          tile.classList.toggle('current-turn', tile.dataset.combatantId === String(currentTurnId));
      });
  }

  function findNextLivingIndex(tiles, startIndex, direction) {
      if (tiles.length === 0) return -1;

      let index = startIndex;
      for (let attempts = 0; attempts < tiles.length; attempts++) {
          index = ((index + direction) % tiles.length + tiles.length) % tiles.length;
          if (tiles[index].dataset.incapacitated !== 'true') {
              return index;
          }
      }
      return -1;
  }

  async function goToTurn(direction) {
      const tiles = getTiles();
      if (tiles.length === 0) return;

      const startIndex = tiles.findIndex(tile => tile.dataset.combatantId === String(currentTurnId));
      const newIndex = findNextLivingIndex(tiles, startIndex === -1 ? -1 : startIndex, direction);
      if (newIndex === -1) return;

      const combatantId = tiles[newIndex].dataset.combatantId;

      await saveCurrentTurn(Number(combatantId));
      currentTurnId = Number(combatantId);
      highlightCurrentTurn();
  }

  function nextTurn() {
      goToTurn(1);
  }

  function previousTurn() {
      goToTurn(-1);
  }

  function sortTilesByInitiative() {
      const grid = document.querySelector('.combatant-grid');
      const tileArray = getTiles();

      tileArray.sort((a, b) => {
          const initA = a.dataset.initiative === '' || a.dataset.initiative === undefined
              ? null : Number(a.dataset.initiative);
          const initB = b.dataset.initiative === '' || b.dataset.initiative === undefined
              ? null : Number(b.dataset.initiative);

          if (initA === null && initB === null) return 0;
          if (initA === null) return 1;
          if (initB === null) return -1;
          return initB - initA;
      });

      tileArray.forEach(tile => grid.appendChild(tile));
  }

  async function updateCombatant(combatantId, data) {
      return apiFetch(`/api/combatants/${combatantId}`, {
          method: 'PUT',
          body: JSON.stringify(data)
      });
  }

  getTiles().forEach(tile => {
      const updateBtn = tile.querySelector('.update-btn');
      if (!updateBtn) return;

      updateBtn.addEventListener('click', async () => {
          const combatantId = tile.dataset.combatantId;

          const initiativeInput = tile.querySelector('.initiative-input');
          const hpInput = tile.querySelector('.hp-input');
          const maxHpInput = tile.querySelector('.maxhp-input');
          const incapacitatedInput = tile.querySelector('.incapacitated-input');

          const payload = {
              initiative: initiativeInput.value === '' ? null : Number(initiativeInput.value),
              hp: hpInput ? (hpInput.value === '' ? null : Number(hpInput.value)) : null,
              maxHp: maxHpInput ? (maxHpInput.value === '' ? null : Number(maxHpInput.value)) : null,
              incapacitated: incapacitatedInput.checked
          };

          const updated = await updateCombatant(combatantId, payload);

          tile.dataset.incapacitated = updated.incapacitated;
          tile.dataset.initiative = updated.initiative === null ? '' : updated.initiative;
          tile.classList.toggle('incapacitated', updated.incapacitated);
          highlightCurrentTurn();
          sortTilesByInitiative();
      });
  });

  highlightCurrentTurn();
</script>
</body>
</html>
