<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title th:text="${encounter.name}">Encounter</title>
  <meta name="_csrf" th:content="${_csrf.token}">
  <meta name="_csrf_header" th:content="${_csrf.headerName}">

  <link rel="stylesheet" th:href="@{/css/theme.css}">
  <link rel="stylesheet" th:href="@{/css/encounter-details.css}">

  <script src="/js/api-fetch.js" defer></script>
</head>
<body>
<!-- Nav fragment creates navigation bar -->
<div th:replace="~{fragments/nav :: nav}"></div>

<main class="page-content">
  <a th:href="@{/campaigns/{id}(id=${encounter.campaign.id})}" class="back-link">&larr; Back to Campaign</a>

  <div class="detail-header">
    <div>
      <h1 th:text="${encounter.name}"></h1>
      <span class="status-tag" th:classappend="${encounter.complete} ? 'inactive' : ''"
            th:text="${encounter.complete} ? 'Completed' : 'Active'"></span>
    </div>
  </div>

  <div class="detail-actions">
    <form th:action="@{/encounters/{id}/toggle-complete(id=${encounter.id})}" method="post">
      <button type="submit" class="btn btn-secondary btn-small"
              th:text="${encounter.complete} ? 'Mark as Active' : 'Mark as Complete'"></button>
    </form>
  </div>

  <!-- turn-tracker: heading + prev/next live in one flex row so controls sit beside the label, not stacked under it -->
  <div class="turn-tracker">
    <h2>Combatants</h2>
    <div class="turn-controls">
      <button type="button" class="btn btn-secondary btn-small" onclick="previousTurn()">&larr; Previous Turn</button>
      <button type="button" class="btn btn-primary btn-small" onclick="nextTurn()">Next Turn &rarr;</button>
    </div>
  </div>

  <div class="combatant-grid">
    <div th:each="c : ${combatants}"
         class="combatant-tile"
         th:classappend="${c.incapacitated} ? 'incapacitated' : ''"
         th:data-combatant-id="${c.id}"
         th:data-incapacitated="${c.incapacitated}"
         th:data-initiative="${c.initiative}">

      <button type="button" class="delete-combatant-btn" title="Remove combatant">&times;</button>

      <strong th:text="${c.name}"></strong>
      <span th:text="${c.player} ? ' (Player)' : ' (NPC)'"></span>

      <label>
        Initiative
        <input type="number" class="initiative-input" th:value="${c.initiative}">
      </label>

      <div th:unless="${c.player}">
        <label class="hp-label">
          HP
          <span class="hp-slash-group">
                <input type="number" class="hp-input" th:value="${c.hp}">
                <span>/</span>
                <input type="number" class="maxhp-input" th:value="${c.maxHp}">
            </span>
        </label>
        <label>
          AC
          <input type="number" class="ac-input" th:value="${c.ac}">
        </label>
      </div>

      <label class="checkbox-label">
        <input type="checkbox" class="incapacitated-input" th:checked="${c.incapacitated}">
        Incapacitated
      </label>

      <button type="button" class="update-btn btn btn-primary btn-small">Update</button>

      <div class="statuses">
        <strong class="statuses-label" th:if="${!c.statuses.isEmpty()}">Statuses:</strong>
        <ul class="status-list">
          <li th:each="s : ${c.statuses}" th:data-status-id="${s.id}">
            <span th:text="${s.status}"></span>
            <button type="button" class="delete-status-btn">x</button>
          </li>
        </ul>
        <button type="button" class="add-status-btn add-row-btn add-row-btn-sm">+ Status</button>
      </div>

      <div class="note-section" th:attr="data-notes=${c.notes} ?: ''"></div>
    </div>

    <p th:if="${combatants.isEmpty()}">No combatants yet.</p>
  </div>

  <button type="button" id="add-combatant-btn" class="add-row-btn">+ Add NPC/Enemy</button>
</main>

<div id="status-modal" class="modal-overlay" style="display: none;">
  <div class="modal-box">
    <h3>Add Status</h3>
    <label>
      Status
      <input type="text" id="status-modal-input" maxlength="25" placeholder="e.g. Poisoned">
    </label>
    <div class="modal-actions">
      <button type="button" id="status-modal-cancel" class="btn btn-secondary btn-small">Cancel</button>
      <button type="button" id="status-modal-save" class="btn btn-primary btn-small">Add</button>
    </div>
  </div>
</div>

<div id="combatant-modal" class="modal-overlay" style="display: none;">
  <div class="modal-box">
    <h3>Add NPC/Enemy</h3>

    <label>
      Use Template
      <select id="combatant-modal-template">
        <option value="">-- Custom --</option>
        <option th:each="t : ${monsterTemplates}"
                th:value="${t.id}"
                th:text="${t.name}"
                th:data-hp="${t.hp}"
                th:data-maxhp="${t.maxHp}"
                th:data-ac="${t.ac}"
                th:data-name="${t.name}">
        </option>
      </select>
    </label>

    <label>
      Name
      <input type="text" id="combatant-modal-name" maxlength="30">
    </label>

    <label>
      Initiative
      <input type="number" id="combatant-modal-initiative">
    </label>

    <label class="hp-label">
      HP
      <span class="hp-slash-group">
                <input type="number" id="combatant-modal-hp">
                <span>/</span>
                <input type="number" id="combatant-modal-maxhp">
            </span>
    </label>

    <label>
      AC
      <input type="number" id="combatant-modal-ac">
    </label>

    <div class="modal-actions">
      <button type="button" id="combatant-modal-cancel" class="btn btn-secondary btn-small">Cancel</button>
      <button type="button" id="combatant-modal-save" class="btn btn-primary btn-small">Add</button>
    </div>
  </div>
</div>

<script th:inline="javascript">
  const encounterId = /*[[${encounter.id}]]*/ 0;
  const initialTurnId = /*[[${encounter.currentTurn != null ? encounter.currentTurn.id : null}]]*/ null;
</script>
<script src="/js/encounter-details.js" defer></script>
</body>
</html>
