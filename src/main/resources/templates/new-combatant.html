<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Add NPC/Enemy</title>
</head>
<body>
<h1>Add NPC/Enemy</h1>
<p th:text="${'To encounter: ' + encounter.name}"></p>

<form th:action="@{/encounters/{id}/combatants(id=${encounter.id})}" method="post">
  <label for="name">Name</label>
  <input type="text" id="name" name="name" required>

  <button type="submit">Add Combatant</button>
</form>

<p><a th:href="@{/encounters/{id}(id=${encounter.id})}">Cancel</a></p>
</body>
</html>
