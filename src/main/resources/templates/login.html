<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - DND Encounter Tool</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <style>
        .auth-page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center; /* centers card vertically+horizontally regardless of viewport size */
            padding: var(--space-md);
        }
        .auth-page h1 {
            font-size: 1.5rem;
            margin-bottom: var(--space-md);
            text-align: center;
        }
        .auth-card {
            width: 100%;
            max-width: 380px; /* caps card width so it doesn't stretch full-bleed on wide screens */
        }
        .auth-card h2 {
            font-size: 1.25rem;
            margin-bottom: var(--space-sm);
        }
        .auth-message {
            font-family: var(--font-body);
            font-size: 0.9rem;
            padding: 0.6rem 0.8rem;
            border-radius: 2px;
            margin-bottom: var(--space-sm);
        }
        .auth-message.error {
            /* replaces old inline style="color: red" with a themed, bordered variant */
            color: var(--color-blood-dark);
            background-color: rgba(139, 30, 30, 0.08);
            border: 1px solid rgba(139, 30, 30, 0.3);
        }
        .auth-message.success {
            color: var(--color-forest);
            background-color: rgba(61, 107, 76, 0.08);
            border: 1px solid rgba(61, 107, 76, 0.3);
        }
        .field-group {
            margin-bottom: var(--space-sm); /* one wrapper per label+input keeps spacing consistent, reused on register.html */
        }
        .field-group label {
            display: block;
            font-family: var(--font-label);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            font-size: 0.75rem;
            color: var(--color-ink);
            opacity: 0.7;
            margin-bottom: 0.35rem;
        }
        .field-group input {
            width: 100%;
            font-family: var(--font-body);
            font-size: 1rem;
            padding: 0.6rem 0.75rem;
            border: 1px solid var(--color-ink);
            border-radius: 2px;
            background-color: var(--color-parchment);
            color: var(--color-ink);
        }
        .field-group input:focus {
            /* replaces default blue browser focus ring w/ theme color; keeps focus visible for a11y */
            outline: 2px solid var(--color-gold);
            outline-offset: 1px;
        }
        .auth-card .btn {
            width: 100%;
            margin-top: var(--space-xs);
        }
        .auth-footer {
            text-align: center;
            font-size: 0.9rem;
            margin-top: var(--space-sm);
        }
    </style>
</head>
<body>
<main class="auth-page">
    <h1>Dungeons & Dragons Encounter Tool</h1>

    <section class="stat-card auth-card">
        <h2>Login</h2>

        <p th:if="${param.error}" class="auth-message error">Invalid username or password.</p>
        <p th:if="${param.logout}" class="auth-message success">You have been logged out.</p>
        <p th:if="${param.registered}" class="auth-message success">Registration successful. Please log in.</p>

        <form th:action="@{/login}" method="post">
            <div class="field-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="field-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit" class="btn btn-primary">Log In</button>
        </form>

        <p class="auth-footer">Don't have an account? <a th:href="@{/register}">Register</a></p>
    </section>
</main>
</body>
</html>
