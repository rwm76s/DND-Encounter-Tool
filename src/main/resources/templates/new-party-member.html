<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>New Party Member</title>
</head>
<body>
<h1>New Party Member</h1>
<p th:text="${'For campaign: ' + campaign.name}"></p>

<form th:action="@{/campaigns/{id}/party-members(id=${campaign.id})}" th:object="${partyMember}" method="post">
  <label for="name">Character Name</label>
  <input type="text" id="name" th:field="*{name}" required>

  <button type="submit">Add Party Member</button>
</form>

<p><a th:href="@{/campaigns/{id}(id=${campaign.id})}">Cancel</a></p>
</body>
</html>
