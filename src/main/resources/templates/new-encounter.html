<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>New Encounter</title>
</head>
<body>
<h1>New Encounter</h1>
<p th:text="${'For campaign: ' + campaign.name}"></p>

<form th:action="@{/campaigns/{id}/encounters(id=${campaign.id})}" method="post">
  <label for="name">Encounter Name</label>
  <input type="text" id="name" name="name" required>

  <button type="submit">Create Encounter</button>
</form>

<p><a th:href="@{/campaigns/{id}(id=${campaign.id})}">Cancel</a></p>
</body>
</html>
